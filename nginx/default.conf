# NothingEats web: the built SPA plus /env.js (runtime config) and /healthz.
# The API is not proxied here: the gateway routes /api/* straight to the services.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Written at container start by /docker-entrypoint.d/40-nothingeats-env.sh.
    location = /env.js {
        alias /tmp/runtime/env.js;
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed file names: cache forever.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Client-side routes all serve index.html, which is always revalidated.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
