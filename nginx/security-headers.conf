# Included in every location: nginx drops inherited add_header directives as soon as a location
# adds its own. The Content-Security-Policy is written at container start (40-nothingeats-env.sh),
# because it names PostHog's origins only when PostHog is configured.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
include /tmp/runtime/csp.conf;
